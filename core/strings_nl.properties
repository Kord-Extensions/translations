extensions.sentry.commandDescription.long=Als je een Sentry-ID van de bot hebt gekregen, kun je met deze opdracht feedback geven over wat je aan het doen was.\n\nJe feedback zou idealiter een beschrijving moeten bevatten van wat je aan het doen was toen de fout optrad en wat je verwachtte dat er zou gebeuren, maar de eigenlijke inhoud van je feedback is aan jou.\n\n**Let op:** Feedback is volledig optioneel en je hoeft je niet verplicht te voelen om feedback te geven als je dat niet wilt. Als je een evenement-ID hebt gekregen, is de fout al verzonden!
