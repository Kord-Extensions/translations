extensions.sentry.commandDescription.long=Pokud vám bot poskytl ID Sentry, můžete tímto příkazem odeslat informace o tom, co jste dělali.\n\nZpětná vazba by měla obsahovat popis toho, co jste při vzniku chyby dělali a jaké chování jste očekávali, její znění je však na vás.\n\n**Poznámka:** Zpětná vazba je zcela dobrovolná. Pokud ji odeslat nechcete, nemusíte — jestliže jste obdrželi ID události, chyba již byla odeslána!
