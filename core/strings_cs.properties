converters.duration.help=__Jak zadávat dobu__\n\nDoba se zadává jako dvojice hodnot a jednotek — například `12d` znamená 12 dní.\nJednotky lze kombinovat — například `2d 12h` znamená 2 dny a 12 hodin.\n\nPodporovány jsou tyto jednotky:\n\n**Sekundy:** `s`, `sek`, `sekunda`, `sekundy`, `sekund`\n**Minuty:** `m`, `min`, `minuta`, `minuty`, `minut`\n**Hodiny:** `h`, `hod`, `hodina`, `hodiny`, `hodin`\n**Dny:** `d`, `den`, `dny`, `dnů`\n**Týdny:** `t`, `týd`, `týden`, `týdny`, `týdnů`\n**Měsíce:** `měs`, `měsíc`, `měsíce`, `měsíců`\n**Roky:** `r`, `rok`, `roky`, `roků`
